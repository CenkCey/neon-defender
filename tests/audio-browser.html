<!doctype html><html lang="en"><meta charset="utf-8"><title>Neon Defender audio verification</title>
<button id="verify">Verify Web Audio</button><pre id="result">Waiting for user gesture</pre>
<script type="module">
import { createAudio, SOUND_EFFECTS } from '../src/audio.ts';
const output = document.querySelector('#result');
document.querySelector('#verify').addEventListener('click', async () => {
  const audio = createAudio(); audio.setEnabled(true);
  const unlocked = await audio.gesture('menu');
  const running = audio.status; audio.setEnabled(false); const muted = audio.status;
  const effects = [];
  for (const effect of Object.keys(SOUND_EFFECTS)) {
    const context = new OfflineAudioContext(1, 44100, 44100);
    const adapter = { state: 'running', currentTime: 0, destination: context.destination,
      createGain: () => context.createGain(), createOscillator: () => context.createOscillator() };
    const synth = createAudio(() => adapter); synth.setEnabled(true); await synth.unlock(); synth.play(effect);
    const buffer = await context.startRendering(); const values = buffer.getChannelData(0);
    let peak = 0, energy = 0;
    for (const sample of values) { peak = Math.max(peak, Math.abs(sample)); energy += sample * sample; }
    effects.push({ effect, peak: +peak.toFixed(5), rms: +Math.sqrt(energy / values.length).toFixed(5), pass: peak > .001 && peak < 1 && Number.isFinite(energy) });
  }
  audio.dispose();
  output.textContent = JSON.stringify({ unlocked, running, muted, effects, pass: unlocked && running.state === 'running' && muted.voices === 0 && effects.every(e => e.pass) }, null, 2);
});
</script></html>
